<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHeard">
<title>SHeard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#121212; --bg2:#1c1c1e; --bg3:#2a2a2d; --line:#333338;
  --fg:#f2f2f2; --fg2:#a8a8ae; --fg3:#6c6c72;
  --accent:#2ad468; --accent-fg:#04210f; --heard:#2ad468; --star:#f5c542; --want:#7aa7ff;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;letter-spacing:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
input,textarea,select{font:inherit;font-size:16px;min-width:0;max-width:100%;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-t) + 12px) 16px calc(90px + var(--safe-b))}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
header.top h1{font-size:26px;line-height:38px;margin:0;font-weight:800;letter-spacing:0}
header.top .sub{color:var(--fg2);font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);flex:none;position:relative}
.icon-btn:active{transform:scale(.94)}
.dot{position:absolute;right:2px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--heard);border:2px solid var(--bg)}
.dot.off{background:var(--fg3)} .dot.busy{background:var(--star)}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:38px;height:44px;border-radius:12px}
.search svg{position:absolute;left:12px;top:13px;opacity:.6}
.li .av.sq{border-radius:6px}
/* 搜尋轉場：只用 transform／opacity／顏色，不在動畫中重排整頁（時長 0.65 秒，iOS 彈簧感曲線） */
.home-head{position:relative;z-index:11;will-change:transform,opacity}
.app.search-mode .home-head{display:none}
.search-row{display:flex;align-items:center;position:sticky;top:calc(var(--safe-t) + 12px);z-index:10;background:var(--bg);margin:0 -16px;padding:0 16px 8px;will-change:transform}
html.scrolled .search-row::after,html.scrolled .backbar::after{opacity:1}
.search-row::after{content:'';position:absolute;left:0;right:0;top:100%;height:32px;background:linear-gradient(to bottom,rgba(18,18,18,1) 0%,rgba(18,18,18,.6) 45%,rgba(18,18,18,0) 100%);pointer-events:none;opacity:0;transition:opacity .15s linear}
.search-row.stuck::after{opacity:1}
.search-row::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:calc(var(--safe-t) + 12px);background:var(--bg)}
#sres{will-change:transform,opacity}
#sform input{height:44px;border:0;border-radius:6px;background:#fff;color:#121212;font-weight:600;padding-left:46px;transition:background-color .65s cubic-bezier(.32,.72,0,1),color .65s cubic-bezier(.32,.72,0,1)}
.search-row.focus #sform input{background:#2a2a2a;color:#fff;font-weight:400}
.search-row.focus #sform input::placeholder{color:#a7a7a7;font-weight:400}
.search-row.focus #sform .s-ic{color:#fff}
.search-cancel{max-width:0;overflow:hidden;white-space:nowrap;padding:8px 0;opacity:0;color:#fff;font-weight:400;font-size:16px;transition:max-width .65s cubic-bezier(.32,.72,0,1),opacity .4s cubic-bezier(.32,.72,0,1),padding .65s cubic-bezier(.32,.72,0,1)}
.search-row.focus .search-cancel{max-width:70px;opacity:1;padding:8px 2px 8px 14px}
.app .search-cancel{color:#fff;font-weight:400}
/* ===== 搜尋（比照 Spotify iOS） ===== */
.search-row .search{flex:1;margin:0;min-width:0}
#sform input::placeholder{color:#535353;font-weight:600}
#sform input:focus{outline:none}
#sform .s-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#121212;opacity:1;transition:color .65s cubic-bezier(.32,.72,0,1)}
#sform input::-webkit-search-cancel-button{-webkit-appearance:none}
.diag{margin-top:10px;font-size:12px}
.diag summary{color:var(--fg2);cursor:pointer;padding:6px 0}
.diag-row{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:6px 0;border-bottom:1px solid var(--line)}
.diag-row span{color:var(--fg3)}
.diag-row code{color:var(--fg2);word-break:break-all;font-size:11px}
.diag-row b{grid-column:1/-1;font-weight:600;color:var(--heard)}
.diag-row.bad b{color:#ff8a8a}
.s-sub{font-size:15px;font-weight:700;color:#fff;margin:16px 0 4px}
.s-title{font-size:18px;font-weight:700;color:#fff;margin:14px 0 6px}
.slist{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer;min-width:0}
.srow:active{opacity:.6}
.srow-img{width:56px;height:56px;flex:none;background:var(--bg3);overflow:hidden;display:grid;place-items:center;color:var(--fg2);font-weight:700;position:relative}
.srow-img.round{border-radius:50%}
.srow-img img{width:100%;height:100%;object-fit:cover;display:block}
.srow-txt{flex:1;min-width:0}
.srow-t{font-size:16px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow-s{font-size:14px;color:#a7a7a7;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow-s .lbl{font-size:14px}
.srow-x{width:40px;height:40px;flex:none;color:#a7a7a7;display:grid;place-items:center;margin-right:-8px}
.srow-acts{display:flex;gap:6px;flex:none}
.srow-acts .mini{width:32px;height:32px;background:transparent;border-color:var(--line)}
.srow-acts .mini.heard{background:var(--heard);border-color:var(--heard)}
.srow-acts .mini.want{background:var(--want);border-color:var(--want)}
.srow-acts .mini.arch{background:#c9ccd1;border-color:#c9ccd1}
.s-clear{margin:22px auto 8px;padding:8px 16px;border:1px solid #727272;border-radius:999px;color:#fff;font-weight:700;font-size:14px;background:transparent}
.s-clear:active{transform:scale(.96)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;padding:6px 14px;border-radius:999px;background:var(--bg2);color:var(--fg2);font-size:13px}
.chip.on{background:var(--fg);color:#111;font-weight:600}
.chip.x{padding:6px 11px;font-weight:700}
.text-btn{color:var(--accent);font-weight:600;font-size:15px;padding:6px 4px}
.sw{position:relative;overflow:hidden}
.sw-del{position:absolute;right:0;top:0;bottom:1px;width:88px;background:#e5484d;color:#fff;font-weight:700;font-size:15px}
.sw-fg{position:relative;background:var(--bg);transition:transform .28s cubic-bezier(.32,.72,0,1);will-change:transform}
.sw.open .sw-fg{transform:translateX(-88px)}
.li .pct{font-size:14px;color:var(--heard);flex:none;font-variant-numeric:tabular-nums}
.li .bar{height:4px;margin-top:5px}
.inline-ic{display:inline-flex;vertical-align:-3px;color:var(--fg)}
.inline-ic svg{width:15px;height:15px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--fg2)} .small{font-size:12.5px}
.empty{text-align:center;color:var(--fg2);padding:40px 12px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media (max-width:380px){.grid{grid-template-columns:1fr 1fr;gap:12px}}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:138px;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.card{position:relative;text-align:left;min-width:0;cursor:pointer}
.cover{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg3)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:var(--fg3)}
.badge{position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.7);font-size:11px;font-weight:600}
.acts{position:absolute;right:6px;bottom:6px;display:flex;gap:6px}
.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.62);border:2px solid rgba(255,255,255,.55);}
.mini.heard{background:var(--heard);border-color:var(--heard);color:#04210f}
.mini.want{background:var(--want);border-color:var(--want);color:#06142e}
.mini.arch{background:#c9ccd1;border-color:#c9ccd1;color:#1a1b1e}
.arow .mini.arch{background:#c9ccd1;border-color:#c9ccd1}
.big-btn.arch{background:#c9ccd1;color:#1a1b1e}
.lbl.arch{color:#a6aab0}
/* 封存：封面變淡（按鈕維持清楚） */
.is-arch .cover img,.is-arch .arow-cover img,.is-arch .srow-img img,.detail-cover.is-arch img{opacity:.2;filter:grayscale(1);transition:opacity .2s,filter .2s}
.archive-link{display:flex;align-items:center;justify-content:center;gap:6px;margin:28px auto 4px;color:var(--fg3);font-size:13px;padding:8px 12px}
.card .t{font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{color:var(--fg2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600}
.lbl.heard{color:var(--heard)} .lbl.want{color:var(--want)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li .av{width:52px;height:52px;border-radius:50%;background:var(--bg3);flex:none;overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--fg2)}
.li .av img{width:100%;height:100%;object-fit:cover}
.li .grow{flex:1;min-width:0}
.li .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--heard);border-radius:4px}

.artist-hero{display:flex;gap:14px;align-items:center;margin:4px 0 16px}
.artist-hero .av{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--bg3);flex:none}
.artist-hero .av img{width:100%;height:100%;object-fit:cover}
.artist-hero h2{margin:0;font-size:22px}
.section-h{font-size:13px;color:var(--fg2);letter-spacing:0;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.section-h:first-child{margin-top:4px}

.panel{background:var(--bg2);border-radius:14px;padding:14px}
.np{display:flex;gap:12px;align-items:center;cursor:pointer}
.np .c{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--bg3);flex:none}
.np .c img{width:100%;height:100%;object-fit:cover}
.np .grow{flex:1;min-width:0}
.np .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:5px}
.eq i{width:3px;background:var(--heard);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,18,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:20}
nav.tabs .in{display:flex;max-width:720px;width:100%}
nav.tabs button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg3);font-size:11px}
nav.tabs button.on{color:var(--fg)}
nav.tabs button.on svg{color:var(--accent)}
nav.tabs .ic-on{display:none}
nav.tabs button.on .ic-on{display:block}
nav.tabs button.on .ic-off{display:none}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .34s cubic-bezier(.32,.72,0,1)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg2);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .34s cubic-bezier(.32,.72,0,1);will-change:transform;backface-visibility:hidden;padding:10px 18px calc(24px + var(--safe-b));max-width:720px;margin:0 auto}

/* 打開：快速出現、緩緩停下（類似原生 App）；收回：稍快 */
.sheet.show{transition:transform .42s cubic-bezier(.16,1,.3,1)}
.scrim.show{transition:opacity .3s ease-out}
.sheet{contain:layout paint;transform:translate3d(0,105%,0)}
.sheet.show{transform:translate3d(0,0,0)}
.grab{touch-action:none}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.detail-cover{width:min(260px,70vw);aspect-ratio:1;border-radius:12px;overflow:hidden;margin:0 auto 14px;background:var(--bg3);box-shadow:0 8px 24px rgba(0,0,0,.4);position:relative}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail h2{text-align:center;margin:0 0 2px;font-size:21px}
.detail .by{text-align:center;color:var(--accent);font-weight:600}
.detail .meta{text-align:center;color:var(--fg2);font-size:13px;margin-top:2px}
.two{display:flex;gap:10px;margin-top:16px}
.big-btn{flex:1 1 0;min-width:0;height:42px;border-radius:999px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bg3)}
.big-btn.heard{background:var(--heard);color:#04210f}
.big-btn.want{background:var(--want);color:#06142e}
.big-btn.solid{background:var(--fg);color:#111}
.btn{text-decoration:none;color:var(--fg);height:42px;border-radius:999px;padding:0 16px;background:var(--bg3);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.sm{height:34px;font-size:13px;padding:0 12px}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{flex:1}
.stars{display:flex;justify-content:center;gap:6px;margin-top:14px}
.stars button{font-size:28px;color:var(--fg3);line-height:1}
.stars button.on{color:var(--star)}
.field{margin-top:12px}
.field label{display:block;font-size:12.5px;color:var(--fg2);margin-bottom:5px}
.tracks{margin-top:14px;border-top:1px solid var(--line);opacity:0;transition:opacity .25s ease}
.tracks.in{opacity:1}
.tracks:empty{border-top:0}
.tracks div{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.tracks span{color:var(--fg3);width:22px;text-align:right;flex:none}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--fg);color:#111;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.toast.show{opacity:1;transform:translateX(-50%)}
.spinner{width:28px;height:28px;border:3px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
.spinner.sm{width:20px;height:20px;margin:16px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.swiping{position:relative;z-index:2;background:var(--bg);box-shadow:-8px 0 24px rgba(0,0,0,.45);will-change:transform}
.swipe-under{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;background:var(--bg)}
.swipe-under>.app{will-change:transform}
.swipe-dim{position:absolute;inset:0;background:#000;opacity:.35}
.backbar{position:sticky;top:0;z-index:30;background:var(--bg);margin:calc(-12px - var(--safe-t)) -16px 8px;padding:var(--safe-t) 16px 0 10px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--fg);font-size:17px;font-weight:500;padding:10px 14px 10px 0;min-height:44px}
.back svg{width:26px;height:26px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2);white-space:nowrap}
.toggle input{width:auto}
.menu-h{font-size:12.5px;color:var(--fg2);letter-spacing:0;margin:20px 0 6px}
.err{color:#ff8a8a;font-size:13px;margin-top:8px}
/* 手機寬度剛好貼合：不允許整頁左右捲動 */
html{overflow-x:hidden;overscroll-behavior-x:none}
body{max-width:100%;overflow-x:clip}
.sheet{overflow-x:hidden}
img,svg{max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.li .name,.card .t,.card .a{min-width:0}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px}
.seg button{width:32px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--fg3)}
.seg button.on{background:var(--bg3);color:var(--fg)}
/* 小圖示：一排 3～4 張，只留封面與名稱 */
.grid.small{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.grid.small .card .t{font-size:12.5px;margin-top:5px}
.grid.small .card .a{font-size:11.5px}
.grid.small .card .a .lbl-w{display:none}
.grid.small .mini{width:26px;height:26px;border-width:1.5px}
.grid.small .mini svg{width:13px;height:13px}
.grid.small .acts{right:4px;bottom:4px;gap:4px}
.grid.small .badge{left:5px;top:5px;padding:2px 5px;font-size:10px}
.grid.small .no{margin-right:4px}
@media (max-width:380px){.grid.small{grid-template-columns:repeat(3,1fr);gap:8px}}
/* 列表 */
.alist{display:flex;flex-direction:column}
.arow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.arow-no{width:24px;flex:none;text-align:right;color:var(--fg3);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.arow-cover{width:52px;height:52px;border-radius:6px;overflow:hidden;background:var(--bg3);flex:none;position:relative}
.arow-cover img{width:100%;height:100%;object-fit:cover;display:block}
.arow-main{flex:1;min-width:0}
.arow-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow-a{color:var(--fg2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow-m{color:var(--fg3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-stars{color:var(--star);margin-left:6px;letter-spacing:1px}
.arow-acts{display:flex;gap:6px;flex:none}
.arow .mini{width:24px;height:24px;border-width:1.5px;background:transparent;border-color:var(--line)}
.arow .mini svg{width:13px;height:13px}
.arow .mini svg *{stroke-width:2.4}
.arow .mini.heard svg *{stroke-width:3.4}
.arow .mini.heard{background:var(--heard);border-color:var(--heard)}
.arow .mini.want{background:var(--want);border-color:var(--want)}
.sort-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--bg2);font-size:13px;font-weight:600}
.sort-btn .muted{font-weight:400}
.sort-btn{min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap}
.sort-btn span{overflow:hidden;text-overflow:ellipsis}
.sort-btn svg{flex:none}
@media (max-width:400px){.sort-btn .muted{display:none}.sort-btn{padding:0 12px}.seg button{width:30px}}
.sort-opt.on .name{color:var(--accent)}
.sort-check{color:var(--accent)}
.card .no{color:var(--fg3);font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.dialog{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:24px;opacity:0;transition:opacity .18s}
.dialog.show{opacity:1}
.dialog-box{background:var(--bg2);border-radius:18px;padding:22px 20px 16px;width:100%;max-width:320px;text-align:center;transform:scale(.94);transition:transform .18s}
.dialog.show .dialog-box{transform:none}
.dialog-box h3{margin:0 0 8px;font-size:17px}
.dialog-box p{margin:0 0 18px;font-size:14px;line-height:1.5}
.dialog-btns{display:flex;gap:10px}
.dialog-btns .btn{flex:1}
.btn.danger{background:#e5484d;color:#fff}
</style>
</head>
